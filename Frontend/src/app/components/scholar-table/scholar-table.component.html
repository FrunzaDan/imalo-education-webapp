<div>
  <button [routerLink]="['/create-scholar']" class="app-button">
    Create Scholar
  </button>
</div>
<table class="app-table">
  <thead>
    <tr>
      <th class="table-header sortable" (click)="sortData('name', 'string')">
        Student Name
        <span class="sort-icon">
          <span [class.active]="currentSortColumn === 'name' && isAscending"
            >↑</span
          >
          <span [class.active]="currentSortColumn === 'name' && !isAscending"
            >↓</span
          >
        </span>
      </th>
      <th
        class="table-header sortable"
        (click)="sortData('schoolName', 'string')"
      >
        School
        <span class="sort-icon">
          <span
            [class.active]="currentSortColumn === 'schoolName' && isAscending"
            >↑</span
          >
          <span
            [class.active]="currentSortColumn === 'schoolName' && !isAscending"
            >↓</span
          >
        </span>
      </th>
      <th class="table-header sortable" (click)="sortData('grade', 'number')">
        Grade
        <span class="sort-icon">
          <span [class.active]="currentSortColumn === 'grade' && isAscending"
            >↑</span
          >
          <span [class.active]="currentSortColumn === 'grade' && !isAscending"
            >↓</span
          >
        </span>
      </th>
      <th class="table-header sortable" (click)="sortData('birthDate', 'date')">
        Birth Date
        <span class="sort-icon">
          <span
            [class.active]="currentSortColumn === 'birthDate' && isAscending"
            >↑</span
          >
          <span
            [class.active]="currentSortColumn === 'birthDate' && !isAscending"
            >↓</span
          >
        </span>
      </th>
    </tr>
  </thead>
  <tbody>
    @for (scholar of scholarData; track scholar.id) {
    <tr
      class="table-row"
      [routerLink]="['/scholars', scholar.id]"
      style="cursor: pointer"
    >
      <td class="table-cell">{{ scholar.name }}</td>
      <td
        class="table-cell"
        [ngStyle]="{
          'background-color': scholar.schoolColor,
          color: getTextColor(scholar.schoolColor)
        }"
      >
        {{ scholar.schoolName }}
      </td>
      <td class="table-cell">{{ scholar.grade }}</td>
      <td class="table-cell">{{ scholar.birthDate }}</td>
    </tr>
    }
  </tbody>
</table>
