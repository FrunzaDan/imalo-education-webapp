<div class="scholar-table-toolbar">
  <input
    type="search"
    class="app-input scholar-table-toolbar__search"
    placeholder="Search by name..."
    [value]="searchTerm"
    (input)="onSearchTermChange($any($event.target).value)"
    aria-label="Search scholars by name"
  />
  <button [routerLink]="['/create-scholar']" class="app-button">
    Create Scholar
  </button>
  <button
    type="button"
    class="app-button scholar-table-toolbar__delete"
    [disabled]="selectedIds.size === 0 || bulkDeleteInProgress"
    (click)="bulkDeleteSelected()"
  >
    {{
      bulkDeleteInProgress
        ? 'Deleting...'
        : 'Delete selected (' + selectedIds.size + ')'
    }}
  </button>
</div>
<table class="app-table">
  <thead>
    <tr>
      <th class="table-header">
        <input
          type="checkbox"
          aria-label="Select all scholars"
          [checked]="allSelected"
          (change)="toggleSelectAll($any($event.target).checked)"
        />
      </th>
      <th class="table-header sortable" (click)="sortData('name', 'string')">
        Student Name
        <span class="sort-icon">
          <span [class.active]="currentSortColumn === 'name' && isAscending"
            >↑</span
          >
          <span [class.active]="currentSortColumn === 'name' && !isAscending"
            >↓</span
          >
        </span>
      </th>
      <th
        class="table-header sortable"
        (click)="sortData('schoolName', 'string')"
      >
        School
        <span class="sort-icon">
          <span
            [class.active]="currentSortColumn === 'schoolName' && isAscending"
            >↑</span
          >
          <span
            [class.active]="currentSortColumn === 'schoolName' && !isAscending"
            >↓</span
          >
        </span>
      </th>
      <th class="table-header sortable" (click)="sortData('grade', 'number')">
        Grade
        <span class="sort-icon">
          <span [class.active]="currentSortColumn === 'grade' && isAscending"
            >↑</span
          >
          <span [class.active]="currentSortColumn === 'grade' && !isAscending"
            >↓</span
          >
        </span>
      </th>
      <th class="table-header sortable" (click)="sortData('birthDate', 'date')">
        Birth Date
        <span class="sort-icon">
          <span
            [class.active]="currentSortColumn === 'birthDate' && isAscending"
            >↑</span
          >
          <span
            [class.active]="currentSortColumn === 'birthDate' && !isAscending"
            >↓</span
          >
        </span>
      </th>
    </tr>
  </thead>
  <tbody>
    @for (scholar of displayedScholarData; track scholar.id) {
    <tr
      class="table-row"
      [routerLink]="['/scholars', scholar.id]"
      style="cursor: pointer"
    >
      <td class="table-cell" (click)="$event.stopPropagation()">
        <input
          type="checkbox"
          [attr.aria-label]="'Select ' + scholar.name"
          [checked]="isSelected(scholar.id)"
          (change)="toggleSelection(scholar.id, $any($event.target).checked)"
        />
      </td>
      <td class="table-cell">{{ scholar.name }}</td>
      <td
        class="table-cell"
        [ngStyle]="{
          'background-color': scholar.schoolColor,
          color: getTextColor(scholar.schoolColor)
        }"
      >
        {{ scholar.schoolName }}
      </td>
      <td class="table-cell">{{ scholar.grade }}</td>
      <td class="table-cell">{{ scholar.birthDate }}</td>
    </tr>
    } @empty {
    <tr class="table-row">
      <td colspan="5" class="table-cell">
        @if (searchTerm) {
          No scholars match "{{ searchTerm }}".
        } @else {
          No scholars yet.
        }
      </td>
    </tr>
    }
  </tbody>
</table>
